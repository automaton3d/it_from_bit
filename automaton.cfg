# =========================
# automaton.cfg
# =========================

# =========================
# simulation
# =========================
# Scenario selection.
#   0 = Full simulation (the single scenario of the model: deterministic,
#       integer-only dynamics on the 3-torus with W winding layers)
#  -1 = the splash screen decides (it then opens on its own default).
# The debug scenarios of the reference GUI (wrapping / relocation / orphan /
# contraction / hunting / reissue / dispersion) were scaffolding and have been
# removed; the list is kept extensible on purpose.
simulation.scenario = 0

# Lattice selection of the last run started from the splash screen.  The setup
# screen opens with these values and writes back whatever was used, so the next
# start repeats the same run.
#   L must be odd: the splash offers 5, 7, ..., 89.
#   W (winding layers): the splash offers 10, 12, ..., 364.
# Memory scales as 3 lattices x L^3 x W x 160 bytes; 21/10 needs ~42 MB, while
# the largest offered pair (89/364) would need ~117 GB and is refused.
simulation.lattice = 21
simulation.layers  = 10

# Region of the lattice the run uses (the setup screen's "Select region..." 3-D
# overlay): inclusive cell bounds.  The model runs the region's EXTENTS as the
# lattice edges, so this is where the memory bill comes from -- an 11 x 11 x 11
# region with W = 10 needs ~6 MB against ~42 MB for the whole 21^3.
#   Every extent must be odd: the model needs a symmetric centre/periodic wrap,
#   so the widget keeps a face on the parity of the opposite one (it moves two
#   cells at a time).  Values that cannot be a region are clamped on load and
#   reported on stdout.
#   The whole lattice is x0 = 0 ... x1 = L-1, and the same for y and z.
simulation.subX0 = 0
simulation.subX1 = 20
simulation.subY0 = 0
simulation.subY1 = 20
simulation.subZ0 = 0
simulation.subZ1 = 20

# =========================
# data3D (visualization layers)
# =========================
data3D.wavefront = true
data3D.momentum  = false
data3D.spin      = false
data3D.sine_mask = false
data3D.polarization = false
data3D.centers   = false
# Spherical cavity of the bubble: the Fibonacci sphere inscribed in the unit cube.
# (This key used to be data3D.lattice; the old name is still read.)
data3D.cavity    = false
data3D.axes      = true
data3D.plane     = false

# Dim ghost of the sine-mask points visited in the last pass of the wavefront
# (tickbox in the bottom-right corner of the 3-D scene).
data3D.visited   = false

# =========================
# delays (pause between phases)
# =========================
delay.convol  = false
delay.diffuse = false
delay.reloc   = false

# =========================
# view
# =========================
view.zoom   = 45.0
view.vis_dx = 0
view.vis_dy = 0
view.vis_dz = 0

# =========================
# projection
# =========================
projection.fov         = 45.0
projection.near        = 0.1
projection.far         = 1000.0
projection.perspective = true